name: Watch BakaSU dev (auto-build)

# Starts build_ingres.yml (with its default inputs) when BakaSU gets a commit that the kernel
# build would use but no release has been built from yet.
#
# Which commit "the build would use" mirrors setup_bakasu in build_ingres.yml: main, unless
# main hard-stops susfs builds ($(error ...) in kernel/tools/susfs_compat.mk) - then the dev
# branch BAKASU_DEV_BRANCH (read from build_ingres.yml, so there is one place to change it).
# If both are blocked the build falls back to a fixed commit, so there is nothing to follow.
#
# Guards against piling up builds:
#   - nothing happens while a build_ingres.yml run is queued or running (next check retries);
#   - each BakaSU commit is dispatched once (a cache entry marks it), so a build that fails
#     is not restarted every hour - use "force" below to retry it by hand.

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:
    inputs:
      force:
        description: "Start the build even if this BakaSU commit was already built or attempted"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: bakasu-dev-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows/build_ingres.yml
          sparse-checkout-cone-mode: false

      - name: Decide
        id: decide
        run: |
          set -eo pipefail
          WF=.github/workflows/build_ingres.yml
          DEV=$(sed -n 's/^ *BAKASU_DEV_BRANCH: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' "$WF" | head -1)
          echo "dev branch from build_ingres.yml: ${DEV:-<none>}"

          # The commit the next build would pick (see the header comment).
          PICK="" SHA=""
          for b in main ${DEV}; do
            s=$(git ls-remote https://github.com/Baka-SU/BakaSU "refs/heads/${b}" | cut -f1)
            if [[ -z "$s" ]]; then echo "${b}: branch does not exist"; continue; fi
            code=$(curl -sSL --retry 3 --retry-delay 5 -o compat.mk -w '%{http_code}' \
              "https://raw.githubusercontent.com/Baka-SU/BakaSU/${s}/kernel/tools/susfs_compat.mk") || code=000
            case "$code" in
              200) if grep -q '^\$(error' compat.mk; then echo "${b} (${s:0:8}): blocks susfs builds"; continue; fi ;;
              404) ;;   # no gate file at all: nothing blocks
              *)   echo "::warning::could not read susfs_compat.mk of ${b} (HTTP ${code}) - checking again next hour"
                   echo "dispatch=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            PICK="$b" SHA="$s"
            break
          done
          if [[ -z "$PICK" ]]; then
            echo "main and ${DEV:-the dev branch} both block susfs builds - the build uses its fixed fallback commit, nothing to follow"
            echo "dispatch=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          SHORT=${SHA:0:8}
          echo "next build would use BakaSU ${PICK} @ ${SHORT}"

          # The newest release that records a BakaSU commit ("BakaSU@xxxxxxxx" in its notes).
          BUILT=$(gh api "repos/${REPO}/releases?per_page=30" \
            --jq '[.[] | (.body // "") | capture("(BakaSU|ReSukiSU)@(?<c>[0-9a-f]{8})")? | .c] | first // ""')
          echo "last released BakaSU commit: ${BUILT:-<none>}"

          BUSY=$(gh api "repos/${REPO}/actions/workflows/build_ingres.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')

          FORCE="${{ inputs.force }}"
          if [[ "$BUILT" == "$SHORT" && "$FORCE" != true ]]; then
            echo "already released - nothing to do"; echo "dispatch=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if (( BUSY > 0 )); then
            echo "a build_ingres.yml run is queued or running - checking again next hour"
            echo "dispatch=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "dispatch=true"
            echo "sha=${SHA}"
            echo "short=${SHORT}"
            echo "branch=${PICK}"
            echo "force=${FORCE:-false}"
          } >> "$GITHUB_OUTPUT"

      # One dispatch per BakaSU commit: a failed build is not restarted every hour.
      - name: Already attempted?
        id: seen
        if: ${{ steps.decide.outputs.dispatch == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .bakasu-dispatched
          key: bakasu-autobuild-${{ steps.decide.outputs.sha }}
          lookup-only: true

      - name: Start build_ingres.yml
        if: ${{ steps.decide.outputs.dispatch == 'true' && (steps.seen.outputs.cache-hit != 'true' || steps.decide.outputs.force == 'true') }}
        env:
          BRANCH: ${{ steps.decide.outputs.branch }}
          SHORT: ${{ steps.decide.outputs.short }}
        run: |
          gh workflow run build_ingres.yml -R "$REPO" --ref "${{ github.event.repository.default_branch }}"
          echo "started build_ingres.yml (default inputs) for BakaSU ${BRANCH} @ ${SHORT}"
          echo "${BRANCH} ${SHORT} $(date -u +%FT%TZ)" > .bakasu-dispatched

      - name: Mark this BakaSU commit as attempted
        if: ${{ steps.decide.outputs.dispatch == 'true' && steps.seen.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .bakasu-dispatched
          key: bakasu-autobuild-${{ steps.decide.outputs.sha }}

      - name: Skipped (already attempted)
        if: ${{ steps.decide.outputs.dispatch == 'true' && steps.seen.outputs.cache-hit == 'true' && steps.decide.outputs.force != 'true' }}
        run: echo "BakaSU ${{ steps.decide.outputs.short }} was already dispatched once (that build may have failed) - run this workflow with force to retry."
